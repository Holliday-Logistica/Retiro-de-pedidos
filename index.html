<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retiro de Pedidos · Mostrador</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#14213d;--mut:#6b7280;--br:#e3e7ef;--ac:#f59e0b;--ac2:#1d3557;--ok:#16a34a;--bad:#dc2626;--in:#f8fafc}
@media (prefers-color-scheme:dark){:root{--bg:#0d1420;--card:#16202f;--tx:#eef2f8;--mut:#9aa7ba;--br:#26344a;--ac2:#274a78;--in:#0f1826}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:linear-gradient(135deg,var(--ac2),#0b1b33);color:#fff;padding:22px 20px 60px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header .wrap{padding:0}
header h1{margin:0;font-size:1.45rem}
header p{margin:6px 0 0;opacity:.8;font-size:.88rem}
.pull{margin-top:-38px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:12px 14px;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.stat b{display:block;font-size:1.7rem;line-height:1}
.stat span{font-size:.78rem;color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1.1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.07);margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:1.05rem}
label{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--br);border-radius:10px;background:var(--in);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--ac)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{cursor:pointer;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;background:var(--in);color:var(--tx);border:1px solid var(--br)}
.pri{background:var(--ac);color:#1b1300;border-color:var(--ac)}
.full{width:100%;margin-top:12px}
.err{color:var(--bad);font-size:.85rem;min-height:1.1em;margin-top:6px}
.hide{display:none!important}
.small{font-size:.8rem;color:var(--mut)}
.searchbar{display:flex;gap:8px}
.searchbar input{font-size:1.15rem;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{--c:#888;padding:7px 12px;font-size:.78rem;border:2px solid var(--c);background:transparent;color:var(--tx);border-radius:99px}
.chip.on{background:var(--c);color:#fff}
.tag{display:inline-block;color:#fff;font-weight:800;font-size:.7rem;padding:3px 10px;border-radius:99px;letter-spacing:.03em}
.est{display:inline-block;font-weight:800;font-size:.7rem;padding:3px 10px;border-radius:99px;background:var(--ac);color:#1b1300}
.est.r{background:var(--mut);color:#fff}
/* mueble */
.mueble{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;gap:6px}
.mc{flex:1;min-width:0;min-height:62px;border-radius:10px;border:2px solid var(--br);background:var(--in);padding:6px;text-align:center;cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.mc b{font-size:.95rem}
.mc span{font-size:.68rem;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc.sel{background:var(--ac)!important;border-color:#1b1300!important;color:#1b1300;animation:pul 1s infinite}
.mc.sel span{color:#3a2800}
@keyframes pul{50%{transform:scale(1.04)}}
.pub .mc{cursor:default;min-height:54px}
.pk{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--br);border-radius:12px;margin-bottom:8px;background:var(--in);cursor:pointer;text-align:left}
.pk input{width:26px;height:26px;flex:none;accent-color:var(--ok)}
.pk b.c{font-size:1.6rem;color:var(--ac);min-width:56px;text-align:center}
canvas.firma{width:100%;height:auto;aspect-ratio:320/140;border:2px dashed var(--mut);border-radius:12px;background:#fff;touch-action:none;display:block}
.cg3{margin-bottom:16px}
.celda{font-size:4.5rem;font-weight:900;line-height:1;color:var(--ac);text-align:center;margin:6px 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0;font-size:.9rem}
dt{color:var(--mut)}dd{margin:0;font-weight:600;text-align:right}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.72rem;color:var(--mut);padding:6px 8px;border-bottom:1px solid var(--br)}
td{padding:9px 8px;border-bottom:1px solid var(--br)}
tr.r{cursor:pointer}tr.r:hover{background:var(--in)}
.tw{overflow-x:auto}
.sr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border:1px solid var(--br);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.sr b.c{font-size:1.5rem;color:var(--ac)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.acts button{flex:1}
/* publico */
.pubc{max-width:440px;margin:-38px auto 40px;padding:0 16px}
.pubc .body{text-align:center}
.stripe{height:8px;background:repeating-linear-gradient(45deg,var(--ac) 0 12px,#1b1b1b 12px 24px);border-radius:0 0 16px 16px;margin-top:-16px}
/* modales */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:1
